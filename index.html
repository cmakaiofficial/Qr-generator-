<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#12151c;--mut:#5f6878;--line:#e1e5ec;--soft:#eef0f6;--ac:#4338ca;--acs:#e9e8ff;--ok:#15803d;--warn:#b45309;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1016;--card:#171b24;--ink:#eef0f5;--mut:#9aa3b3;--line:#282e3b;--soft:#212736;--ac:#8b85ff;--acs:#262450;--ok:#4ade80;--warn:#fbbf24;--sh:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top)}
button,input,textarea,select,summary{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top div{max-width:980px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--ac);display:grid;place-items:center}
.brand{font-weight:800;font-size:18px;letter-spacing:-.4px}.tag{margin-left:auto;font-size:12px;color:var(--mut)}
.wrap{max-width:980px;margin:auto;padding:20px 16px 48px}
h1{font-size:26px;letter-spacing:-.7px;line-height:1.2;margin:4px 0 6px}
.sub{color:var(--mut);margin:0 0 18px;max-width:52ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.card+.card{margin-top:14px}
.hd{font-size:13px;font-weight:700;color:var(--mut);margin:0 0 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:0 18px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-weight:600;font-size:14px}
.tab[aria-selected=true]{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.f{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],input[type=password],textarea,select{width:100%;min-height:48px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--ac);outline:0;box-shadow:0 0 0 3px var(--acs)}
textarea{min-height:104px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
details.card{padding:0}
summary{list-style:none;cursor:pointer;min-height:56px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-weight:700}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
.body{padding:2px 18px 6px}
.clr{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;min-height:48px}
.clr input{width:34px;height:34px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}
.clr span{font-size:14px;font-variant-numeric:tabular-nums;color:var(--mut)}
input[type=range]{width:100%;min-height:32px;accent-color:var(--ac)}
.side{position:sticky;top:14px}
.stage{background:#fff;border-radius:14px;display:grid;place-items:center;padding:14px;border:1px solid var(--line);min-height:180px}
.ph{color:#8a93a3;font-size:14px}
canvas{max-width:100%;height:auto;display:block}
.msg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:12px 0 2px;min-height:22px}
.msg::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.msg.ok::before{background:var(--ok)}.msg.w{color:var(--warn)}.msg.w::before{background:var(--warn)}
.meta{font-size:12px;color:var(--mut);margin:0 0 14px 16px;min-height:18px}
.actions{display:flex;gap:8px}
.btn{flex:1;min-height:48px;border:0;border-radius:12px;background:var(--soft);font-weight:700;cursor:pointer;padding:0 12px}
.btn.p{background:var(--ac);color:#fff;flex:2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media(min-width:821px){.toast{bottom:24px}.actions{flex-wrap:wrap}.actions .btn{flex:1 1 40%}.actions .btn.p{flex:1 1 100%}}
@media(max-width:820px){
 .grid{grid-template-columns:1fr}.side{position:static;order:-1}
 .wrap{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
 h1{font-size:22px}.sub{font-size:14px;margin-bottom:14px}.tag{display:none}
 .card{padding:14px;border-radius:14px}.tabs{margin:0 -14px 14px;padding:0 14px 4px}
 summary{padding:0 14px}.body{padding:2px 14px 4px}
 .actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
 #pt,.nomob{display:none}
}
@media(max-width:400px){.body .two{grid-template-columns:1fr}.body .two.k{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div><span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="#fff"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="11" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="3" height="3"/><rect x="15" y="15" width="2" height="2"/></svg></span><span class="brand">QR Generator</span><span class="tag">Free · Private · No sign-up</span></div></header>
<main class="wrap">
<h1>Create a QR code in seconds</h1>
<p class="sub">Choose a type, enter your details and download a sharp, print-ready code.</p>
<div class="grid">
<div>
<section class="card" aria-label="Content">
<p class="hd">Content</p>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="form"></div>
</section>
<details class="card" id="style">
<summary>Style and size</summary>
<div class="body">
<div class="two k">
<div class="f"><label for="fg">QR colour</label><div class="clr"><input type="color" id="fg" value="#111827"><span id="fgv">#111827</span></div></div>
<div class="f"><label for="bg">Background</label><div class="clr"><input type="color" id="bg" value="#ffffff"><span id="bgv">#ffffff</span></div></div>
</div>
<div class="f"><label for="ec">Error correction</label><select id="ec"><option value="L">Low, smallest code</option><option value="M" selected>Medium, recommended</option><option value="Q">Quartile</option><option value="H">High, most durable</option></select></div>
<div class="f"><label for="sz">Download size: <span id="szv">1024</span> px</label><input type="range" id="sz" min="256" max="2048" step="128" value="1024"></div>
<div class="f"><label for="mg">Quiet margin: <span id="mgv">4</span></label><input type="range" id="mg" min="0" max="8" value="4"></div>
</div>
</details>
</div>
<aside class="side">
<section class="card" aria-label="Preview">
<p class="hd">Your QR code</p>
<div class="stage" id="stage"></div>
<div class="msg" id="msg" role="status"></div>
<p class="meta" id="meta"></p>
<div class="actions">
<button class="btn p" id="png" type="button">Download PNG</button>
<button class="btn" id="svg" type="button">SVG</button>
<button class="btn" id="cp" type="button">Copy</button>
<button class="btn" id="sh" type="button" hidden>Share</button>
<button class="btn" id="pt" type="button">Print</button>
</div>
</section>
</aside>
</div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const F=(id,l,t,ph,extra)=>({id,l,t:t||'text',ph:ph||'',extra});
const TYPES={
 'Text / URL':{f:[F('v','Text or link','area','https://example.com')],b:d=>d.v},
 'Wi-Fi':{f:[F('ss','Network name (SSID)'),F('pw','Password','password'),F('sec','Security','sel',0,['WPA','WEP','nopass'])],
  b:d=>{const e=s=>(s||'').replace(/([\\;,:"])/g,'\\$1');return d.ss?'WIFI:T:'+d.sec+';S:'+e(d.ss)+';'+(d.sec==='nopass'?'':'P:'+e(d.pw)+';')+';':''}},
 'Contact':{f:[F('fn','First name'),F('ln','Last name'),F('ph','Phone','tel'),F('em','Email','email'),F('og','Company'),F('ur','Website')],
  b:d=>{if(!d.fn&&!d.ln)return'';const c=s=>(s||'').replace(/([\\;,])/g,'\\$1').replace(/\n/g,' ');
   return['BEGIN:VCARD','VERSION:3.0','N:'+c(d.ln)+';'+c(d.fn)+';;;','FN:'+c((d.fn+' '+d.ln).trim()),d.og&&'ORG:'+c(d.og),d.ph&&'TEL:'+c(d.ph),d.em&&'EMAIL:'+c(d.em),d.ur&&'URL:'+c(d.ur),'END:VCARD'].filter(Boolean).join('\n')}},
 'Email':{f:[F('to','To','email'),F('sj','Subject'),F('bd','Message','area')],
  b:d=>d.to?'mailto:'+d.to+'?subject='+encodeURIComponent(d.sj||'')+'&body='+encodeURIComponent(d.bd||''):''},
 'Phone':{f:[F('tl','Phone number','tel','+91 98765 43210')],b:d=>d.tl?'tel:'+d.tl.replace(/[^\d+]/g,''):''},
 'SMS':{f:[F('sn','Phone number','tel'),F('sm','Message','area')],b:d=>d.sn?'SMSTO:'+d.sn.replace(/[^\d+]/g,'')+':'+(d.sm||''):''},
 'WhatsApp':{f:[F('wn','Number with country code','tel','919876543210'),F('wm','Message','area')],
  b:d=>{const n=(d.wn||'').replace(/\D/g,'');return n?'https://wa.me/'+n+(d.wm?'?text='+encodeURIComponent(d.wm):''):''}}
};
const ICON={'Text / URL':'🔗','Wi-Fi':'📶','Contact':'👤','Email':'✉️','Phone':'📞','SMS':'💬','WhatsApp':'🟢'};
let cur='Text / URL',qr=null,text='';
qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2000)}
function tabs(){
  $('tabs').innerHTML='';
  Object.keys(TYPES).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='tab';b.innerHTML='<span aria-hidden="true">'+ICON[k]+'</span>'+k;b.setAttribute('role','tab');b.setAttribute('aria-selected',k===cur);b.onclick=()=>{cur=k;tabs();form();make()};$('tabs').append(b)});
}
const vals={};
function form(){
  $('form').innerHTML=TYPES[cur].f.map(f=>{
    const v=vals[f.id]||'';let i;
    if(f.t==='area')i='<textarea id="'+f.id+'" placeholder="'+f.ph+'"></textarea>';
    else if(f.t==='sel')i='<select id="'+f.id+'">'+f.extra.map(o=>'<option>'+o+'</option>').join('')+'</select>';
    else i='<input type="'+f.t+'" id="'+f.id+'" placeholder="'+f.ph+'" autocomplete="off" autocapitalize="off">';
    return '<div class="f"><label for="'+f.id+'">'+f.l+'</label>'+i+'</div>'}).join('');
  TYPES[cur].f.forEach(f=>{const e=$(f.id);if(vals[f.id])e.value=vals[f.id];e.addEventListener('input',()=>{vals[f.id]=e.value;make()})});
}
function data(){const d={};TYPES[cur].f.forEach(f=>d[f.id]=(vals[f.id]||'').trim());if(cur==='Wi-Fi')d.sec=$('sec').value;return d}
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function make(){
  const m=$('msg');m.className='msg';$('meta').textContent='';
  text=TYPES[cur].b(data());
  $('png').disabled=$('svg').disabled=$('cp').disabled=$('pt').disabled=$('sh').disabled=!text;
  if(!text){qr=null;$('stage').innerHTML='';m.textContent='Add your content to create the QR.';$('stage').innerHTML='<div class="ph">QR preview</div>';return}
  try{qr=qrcode(0,$('ec').value);qr.addData(text);qr.make()}
  catch(e){qr=null;$('stage').innerHTML='<div class="ph">Too long</div>';m.textContent='Too much content for one QR. Shorten it or lower error correction.';m.classList.add('w');return}
  const s=Math.min(320,innerWidth-88);$('stage').innerHTML='';$('stage').append(draw(s));
  const a=lum($('fg').value),b=lum($('bg').value),r=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);
  if(a>=b){m.textContent='Use a darker QR colour than the background, or it may not scan.';m.classList.add('w')}
  else if(r<3){m.textContent='Low contrast. Pick a darker colour so it scans reliably.';m.classList.add('w')}
  else{m.classList.add('ok');m.textContent='Ready. Test it with your camera.'}
  $('meta').textContent=text.length+' characters · '+qr.getModuleCount()+'×'+qr.getModuleCount()+' modules';
}
function draw(size){
  const n=qr.getModuleCount(),mg=+$('mg').value,cell=Math.max(1,Math.floor(size/(n+2*mg))),px=cell*(n+2*mg);
  const c=document.createElement('canvas');c.width=c.height=px;const x=c.getContext('2d');
  x.fillStyle=$('bg').value;x.fillRect(0,0,px,px);x.fillStyle=$('fg').value;
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect((k+mg)*cell,(r+mg)*cell,cell,cell);
  return c;
}
function svg(){
  const n=qr.getModuleCount(),mg=+$('mg').value,t=n+2*mg;let p='';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))p+='M'+(k+mg)+' '+(r+mg)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" width="'+$('sz').value+'" height="'+$('sz').value+'" shape-rendering="crispEdges"><rect width="'+t+'" height="'+t+'" fill="'+$('bg').value+'"/><path d="'+p+'" fill="'+$('fg').value+'"/></svg>';
}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const big=()=>draw(+$('sz').value);
$('png').onclick=()=>big().toBlob(b=>{save(b,'qr-code.png');toast('PNG downloaded')});
$('svg').onclick=()=>{save(new Blob([svg()],{type:'image/svg+xml'}),'qr-code.svg');toast('SVG downloaded')};
$('cp').onclick=()=>big().toBlob(async b=>{
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Image copied')}
  catch(e){save(b,'qr-code.png');toast('Copy not supported here. Downloaded instead.')}});
$('pt').onclick=()=>{const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print');
  w.document.write('<title>QR</title><body style="margin:0;display:grid;place-items:center;height:100vh"><img src="'+big().toDataURL()+'" style="width:70vmin">');w.document.close();w.onload=()=>w.print()};
if(navigator.share&&navigator.canShare){$('sh').hidden=false;$('cp').classList.add('nomob')}
if(innerWidth>820)$('style').open=true;
$('sh').onclick=()=>big().toBlob(async b=>{const f=new File([b],'qr-code.png',{type:'image/png'});
  try{if(navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast('Sharing images is not supported here')}catch(e){}});
['fg','bg','ec','mg','sz'].forEach(id=>$(id).addEventListener('input',()=>{$('mgv').textContent=$('mg').value;$('szv').textContent=$('sz').value;$('fgv').textContent=$('fg').value;$('bgv').textContent=$('bg').value;make()}));
addEventListener('resize',()=>{if(qr)make()});
tabs();form();make();
</script>
</body>
</html>
